{{- /* Module 110 : un ServiceAccount dédié, sans token monté (les apps n'appellent pas l'API K8s) */ -}}
{{- if .Values.security.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-spring-demo
  labels:
    {{- include "spring-demo.labels" (dict "root" . "name" "spring-demo") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
