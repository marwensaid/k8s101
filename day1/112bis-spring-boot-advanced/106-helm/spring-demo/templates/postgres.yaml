{{- /* Module 112 : PostgreSQL en StatefulSet avec un PVC par Pod */ -}}
{{- if .Values.postgres.enabled }}
{{- $labels := dict "root" . "name" "postgres" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "spring-demo.labels" $labels | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database }}
  POSTGRES_USER: {{ .Values.postgres.username }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "spring-demo.labels" $labels | nindent 4 }}
spec:
  clusterIP: None                      # headless : requis par un StatefulSet
  selector:
    {{- include "spring-demo.selectorLabels" $labels | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "spring-demo.labels" $labels | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "spring-demo.selectorLabels" $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "spring-demo.selectorLabels" $labels | nindent 8 }}
    spec:
      {{- if .Values.security.hardened }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 70                  # uid "postgres" de l'image alpine
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      {{- end }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          {{- if .Values.security.hardened }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          {{- end }}
          ports:
            - { name: postgres, containerPort: 5432 }
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { memory: 256Mi }
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 10
  volumeClaimTemplates:                # un PVC "data-<pod>" créé automatiquement, conservé si le Pod meurt
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
