# Module 111 : générateur de charge — 5 Pods qui martèlent le catalogue pendant 3 minutes.
#   kubectl -n spring-helm apply -f load-generator.yaml
#   kubectl -n spring-helm get hpa -w
#   kubectl -n spring-helm delete job load-generator
apiVersion: batch/v1
kind: Job
metadata:
  name: load-generator
  labels:
    app.kubernetes.io/name: test        # autorisé par les NetworkPolicies du 110
spec:
  parallelism: 5
  completions: 5
  backoffLimit: 0
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test
    spec:
      restartPolicy: Never
      # Conforme au profil PSS restricted (module 110)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: load
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          command: ["sh", "-c"]
          args:
            - |
              end=$(( $(date +%s) + 180 ))
              while [ $(date +%s) -lt $end ]; do
                wget -qO- http://demo-catalog:8080/api/products >/dev/null 2>&1 || true
              done
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 64Mi }
