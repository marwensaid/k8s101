# Module 108 — CI/CD du TD Spring Boot avancé (day1/112bis-spring-boot-advanced)
#
#   PR  → test Maven, lint Helm, validate Terraform, build Docker (sans push)
#   main → idem + push des images sur GHCR, taggées :<sha> et :latest
#
name: spring-demo

on:
  pull_request:
    paths:
      - "day1/112bis-spring-boot-advanced/**"
      - ".github/workflows/spring-demo.yml"
  push:
    branches: [main]
    paths:
      - "day1/112bis-spring-boot-advanced/**"
      - ".github/workflows/spring-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  APP_DIR: day1/112bis-spring-boot-advanced/app
  LAB_DIR: day1/112bis-spring-boot-advanced

jobs:
  # ── 1. Tests unitaires Java, en parallèle pour les deux services ────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalog-service, order-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ env.APP_DIR }}/${{ matrix.service }}/pom.xml
      - name: mvn verify
        working-directory: ${{ env.APP_DIR }}/${{ matrix.service }}
        run: ./mvnw -B -q verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-${{ matrix.service }}
          path: ${{ env.APP_DIR }}/${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

  # ── 2. Lint des manifests : Helm + Terraform ────────────────────────────────
  lint-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint + template (toutes les briques activées)
        working-directory: ${{ env.LAB_DIR }}/106-helm
        run: |
          helm lint spring-demo
          helm template ci spring-demo \
            -f ../109-observability/values.yaml \
            -f ../110-security/values.yaml \
            -f ../111-autoscaling/values.yaml \
            -f ../112-storage/values.yaml > /dev/null
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt + validate
        working-directory: ${{ env.LAB_DIR }}/107-terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

  # ── 3. Build (et push sur main) des images ──────────────────────────────────
  docker:
    needs: [test, lint-infra]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalog-service, order-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}/${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. Scan de sécurité des images (module 110) ─────────────────────────────
  scan:
    needs: docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalog-service, order-service]
    steps:
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
